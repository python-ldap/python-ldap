[build-system]
requires = [
    # PEP 639 license metadata in [project] needs setuptools >= 77
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "python-ldap"
dynamic = ["version"]
description = "Python modules for implementing LDAP clients"

license = "MIT AND LicenseRef-python-ldap"
license-files = [
    "LICENCE",
    "LICENCE.MIT",
]

authors = [
    { name = "python-ldap project", email = "python-ldap@python.org" },
]
readme = { file = "README.rst", content-type = "text/x-rst" }

requires-python = ">=3.9"
keywords = ["ldap", "directory", "authentication"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",

    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",

    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Programming Language :: Python :: Free Threading :: 2 - Beta",

    "Topic :: Database",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
dependencies = [
    "pyasn1>=0.3.7",
    "pyasn1_modules>=0.1.5",
]

[project.urls]
Homepage = "https://www.python-ldap.org/"
Documentation = "https://python-ldap.readthedocs.io/"
Repository = "https://github.com/python-ldap/python-ldap"
Download = "https://pypi.org/project/python-ldap/"
Changelog = "https://github.com/python-ldap/python-ldap/blob/main/CHANGES"
Issues = "https://github.com/python-ldap/python-ldap/issues"

[tool.setuptools]
zip-safe = false
include-package-data = true
# Explicitly list all Python modules
py-modules = ["ldapurl", "ldif", "_ldap"]

[tool.setuptools.package-data]
ldap = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "ldap.pkginfo.__version__"}

[tool.setuptools.packages.find]
where = ["Lib"]

[tool.setuptools.package-dir]
"" = "Lib"

[tool.ruff]
# ruff 0.16.8
target-version = "py39"
output-format = "concise"

line-length = 120
indent-width = 4

[tool.ruff.lint]
task-tags = ["TODO", "FIXME"]
extend-select = [
 "C90",  # complex-structure
]
ignore = [
 # conflict with --preview or --unsafe-fixes
 "RUF100", # unused-noqa
 # too many violations
 "UP031", # printf-string-formatting
 "RUF012", # mutable-class-default
 # a few auto-unfixable violations leftover
 "SIM115", # open-file-with-context-handler
 "EXE002", # shebang-missing-executable-file
 "B018", # useless-expression
 "E722", # bare-except
 "BLE001", # blind-except
 "PLW0602", # global-variable-not-assigned
 "PLW1508", # invalid-envvar-default
 "S110", # try-except-pass
 "SIM102", # collapsible-if
 "SIM113", # enumerate-for-loop
 "SIM103", # needless-bool
 "LOG015", # root-logger-call
 "PLW1510", # subprocess-run-without-check
 "TRY004", # type-check-without-type-error
 "TRY401", # verbose-log-message
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "single"  # https://github.com/astral-sh/ruff/issues/7525

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ldap", "_ldap", "ldapurl", "ldif", "slapdtest"]
known-third-party = ["pyasn1", "pyasn1_modules"]
known-local-folder = []
lines-after-imports = 2

[tool.coverage.run]
branch = true
source = [
    "ldap",
    "ldif",
    "ldapurl",
    "slapdtest",
]

[tool.coverage.paths]
source = [
    "Lib/",
    ".tox/*/lib/python*/site-packages/",
]

[tool.coverage.report]
ignore_errors = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "build/htmlcov"
title = "python-ldap coverage report"

[tool.mypy]
strict = true
files = ["Lib/"]

[[tool.mypy.overrides]]
module = ["pyasn1.*", "pyasn1_modules.*"]
ignore_missing_imports = true
