---
name: CI

on:
  push:
  pull_request:
  schedule:
    # every Monday
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_ubuntu:
    name: "Ubuntu with Python ${{ matrix.python-version }}"
    runs-on: "${{ matrix.image }}"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.15"
          - "3.14t"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"
        image:
          - "ubuntu-22.04"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: "Install apt dependencies"
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ldap-utils slapd enchant-2 libldap2-dev libsasl2-dev apparmor-utils
      - name: "Disable AppArmor"
        run: sudo aa-disable /usr/sbin/slapd
      - name: "Setup Python using uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: "Install Python dependencies"
        run: >
          uv pip install --upgrade pip setuptools tox tox-gh-actions
      - name: Test
        run: python -m tox

  test_fedora:
    name: Tox env "${{matrix.tox_env}}" on Fedora
    # Use GitHub's Linux Docker host
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        tox_env:
          - py39
          - py310
          - py311
          - py312
          - py313
          - py314
          - py315
          - py3-nosasltls
          - py3-trace
          - pypy3
          - doc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Test ${{ matrix.tox_env }}"
        uses: fedora-python/tox-github-action@v41.0
        with:
          tox_env: ${{ matrix.tox_env }}
          dnf_install: >
            @c-development openldap-devel python3-devel
            openldap-servers openldap-clients lcov clang-analyzer valgrind
            enchant python3-setuptools

# TODO: add tests for Windows and MacOS - help welcome!
