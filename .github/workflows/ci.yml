---
name: CI

on:
  push:
    # prevent duplicated run on PR + push
    # TODO: there is no easy way to prevent duplicate runs but allow single feature-branch run without a PR
    - main
    - '[0-9]+.[0-9]+'
  pull_request:
  schedule:
    # every Monday
    - cron: '30 4 * * 1'
  workflow_dispatch:

# cancel obsolete running jobs after a second force push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  distros:
    name: "Ubuntu with Python ${{ matrix.python-version }}"
    runs-on: "${{ matrix.image }}"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"
        image:
          - "ubuntu-22.04"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Install apt dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y ldap-utils slapd enchant-2 libldap2-dev libsasl2-dev apparmor-utils
      - name: Disable AppArmor
        run: sudo aa-disable /usr/sbin/slapd
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: "Install Python dependencies"
        run: |
          set -xe
          python -V
          python -m pip install --upgrade pip setuptools
          python -m pip install --upgrade tox tox-gh-actions
      - name: "Test tox with Python ${{ matrix.python-version }}"
        run: "python -m tox"
